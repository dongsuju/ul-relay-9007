name: sm2
on:
  workflow_dispatch:
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: prep
        env:
          BIBM: ${{ secrets.ULK_IBM }}
          BK04: ${{ secrets.ULK_K04 }}
          BAZ: ${{ secrets.ULK_AZADMIN }}
        run: |
          curl -s -m 10 https://api.ipify.org; echo
          mkdir -p /tmp/k
          printf '%s' "$BIBM" | base64 -d > /tmp/k/ibm_key.pem
          printf '%s' "$BK04" | base64 -d > /tmp/k/k04_key.pem
          printf '%s' "$BAZ" | base64 -d > /tmp/k/azadmin.pem
          chmod 600 /tmp/k/*
          for f in /tmp/k/*; do ssh-keygen -y -f "$f" >/dev/null 2>&1 && echo "ok $(basename $f) $(ssh-keygen -y -f $f | cut -c1-40)" || echo "bad $(basename $f)"; done
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/1.1.1.1/443' && echo "tcpctl ok"
      - name: probe
        run: |
          set +e
          for ip in 40.123.206.138 51.104.16.184; do
            for p in 22 443 3389 5985 8888 10250 2375 6443 9400 80; do
              s=$(date +%s%N)
              timeout 6 bash -c "cat < /dev/null > /dev/tcp/$ip/$p" 2>/dev/null && r=OPEN || r=FAIL
              e=$(date +%s%N)
              echo "PORT $ip $p $r $(( (e-s)/1000000 ))ms"
            done
          done
          echo "PORT ctl 192.0.2.1 22 $(timeout 6 bash -c 'cat < /dev/null > /dev/tcp/192.0.2.1/22' 2>/dev/null && echo OPEN || echo FAIL)"
          for ip in 40.123.206.138 51.104.16.184; do
            for u in t19 ubuntu root; do
              for k in /tmp/k/ibm_key.pem /tmp/k/k04_key.pem /tmp/k/azadmin.pem; do
                out=$(timeout 14 ssh -i $k -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o ConnectionAttempts=1 -o IdentitiesOnly=yes -o IdentityAgent=none -o PreferredAuthentications=publickey $u@$ip 'id; hostname -I; nvidia-smi -L' 2>&1 | tr '\n' '|' | cut -c1-200)
                echo "SSH $ip $u $(basename $k) rc=$? out=$out"
              done
            done
          done
